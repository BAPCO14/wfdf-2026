<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <radialGradient id="bg2" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#003300"/>
      <stop offset="100%" stop-color="#0d1a0d"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00aa00" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00aa00" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="500" fill="url(#bg2)"/>
  <ellipse cx="200" cy="200" rx="180" ry="200" fill="url(#glow2)"/>
  <circle cx="200" cy="180" r="160" fill="none" stroke="#00aa00" stroke-width="1" opacity="0.2"/>
  <circle cx="200" cy="180" r="120" fill="none" stroke="#00aa00" stroke-width="1" opacity="0.15"/>
  <circle cx="200" cy="180" r="80" fill="none" stroke="#005B8E" stroke-width="1" opacity="0.25"/>
  <!-- Body -->
  <ellipse cx="200" cy="225" rx="70" ry="85" fill="#002200"/>
  <!-- Head -->
  <circle cx="200" cy="128" r="58" fill="#003300"/>
  <!-- Jersey - green with MvG style -->
  <rect x="140" y="210" width="120" height="80" rx="5" fill="#004400"/>
  <rect x="160" y="215" width="80" height="10" rx="2" fill="#00aa00" opacity="0.8"/>
  <rect x="170" y="230" width="60" height="6" rx="1" fill="#00aa00" opacity="0.5"/>
  <!-- MvG text on jersey -->
  <text x="200" y="268" font-family="Arial Black, sans-serif" font-weight="900" font-size="14" fill="#00ff00" text-anchor="middle" opacity="0.8">MvG</text>
  <!-- Ranking badge -->
  <circle cx="200" cy="175" r="22" fill="#005B8E" opacity="0.9"/>
  <text x="200" y="181" font-family="Arial Black, sans-serif" font-weight="900" font-size="16" fill="white" text-anchor="middle">#3</text>
  <!-- Flag -->
  <text x="30" y="55" font-size="36">🇳🇱</text>
  <!-- Name -->
  <rect x="0" y="420" width="400" height="80" fill="#0d1a0d" opacity="0.95"/>
  <text x="200" y="450" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="22" fill="white" text-anchor="middle" letter-spacing="1">VAN GERWEN</text>
  <text x="200" y="474" font-family="Arial, sans-serif" font-size="11" fill="#00cc44" text-anchor="middle" letter-spacing="4">MIGHTY MvG</text>
</svg>
