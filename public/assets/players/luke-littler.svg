<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <radialGradient id="bg" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#3d0060"/>
      <stop offset="100%" stop-color="#0d0d1a"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#660066" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#660066" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Background -->
  <rect width="400" height="500" fill="url(#bg)"/>
  <!-- Glow -->
  <ellipse cx="200" cy="200" rx="180" ry="200" fill="url(#glow)"/>
  <!-- Dart board decorative -->
  <circle cx="200" cy="180" r="160" fill="none" stroke="#660066" stroke-width="1" opacity="0.2"/>
  <circle cx="200" cy="180" r="120" fill="none" stroke="#660066" stroke-width="1" opacity="0.15"/>
  <circle cx="200" cy="180" r="80" fill="none" stroke="#E40520" stroke-width="1" opacity="0.2"/>
  <!-- Silhouette body -->
  <ellipse cx="200" cy="220" rx="65" ry="80" fill="#1a0535"/>
  <!-- Head -->
  <circle cx="200" cy="130" r="55" fill="#2a1045"/>
  <!-- Jersey details -->
  <rect x="145" y="210" width="110" height="70" rx="5" fill="#1a0535"/>
  <rect x="165" y="215" width="70" height="8" rx="2" fill="#E40520" opacity="0.8"/>
  <!-- Number 1 badge -->
  <circle cx="200" cy="180" r="20" fill="#E40520" opacity="0.9"/>
  <text x="200" y="186" font-family="Arial Black, sans-serif" font-weight="900" font-size="18" fill="white" text-anchor="middle">#1</text>
  <!-- Flag -->
  <text x="30" y="55" font-size="36">🏴󠁧󠁢󠁥󠁮󠁧󠁿</text>
  <!-- Name -->
  <rect x="0" y="420" width="400" height="80" fill="#0d0d1a" opacity="0.9"/>
  <text x="200" y="453" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="30" fill="white" text-anchor="middle" letter-spacing="2">LITTLER</text>
  <text x="200" y="475" font-family="Arial, sans-serif" font-size="11" fill="#cc00cc" text-anchor="middle" letter-spacing="4">THE NUKE</text>
  <!-- Stars decoration -->
  <text x="340" y="55" font-size="28">⭐</text>
</svg>
