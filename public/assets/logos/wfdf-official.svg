    <line x1="47" y1="67" x2="253" y2="233"/>
    <line x1="30" y1="104" x2="270" y2="196"/>
    <line x1="24" y1="144" x2="276" y2="156"/>
    <line x1="31" y1="184" x2="269" y2="116"/>
    <line x1="50" y1="220" x2="250" y2="80"/>
